[project]
name = "gin-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "open-spiel==2.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "trackio>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "N", "W", "C90"]
ignore = ["E501"]

[tool.ruff.format]
# (line-length is set once under [tool.ruff] above)
